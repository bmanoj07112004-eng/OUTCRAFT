<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OUTCRAFT dev: characters</title>
    <!--
      Harness for src/3d/characters.js.
        ?anim=idle|walk|jog|gather|scoop|deposit|wait|think|cheer|sad|hop|wave, a comma list (one per character, cycling) or mix (all of them)
        ?set=all|skins|rivals|explorer,pip,villager   ?cols=7   ?zoom=1   ?yaw=0 (degrees, 180 = backs)
        ?carry=wood,stone,ore   ?t=1.2 (freeze at this time)   ?tone=aces|none
        ?portraits=1 (&size=128)   ?preview=1 (&skin=wizard)   ?items=1
    -->
    <script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#5fb8ff, #dff3ff 70%);
        font-family: system-ui, sans-serif;
      }
      #c {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #labels div {
        position: absolute;
        transform: translate(-50%, 0);
        font: 700 11px system-ui, sans-serif;
        color: #fff;
        background: rgba(20, 30, 50, 0.55);
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
      }
      #grid {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 18px;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-content: flex-start;
        background: linear-gradient(160deg, #2b3a67, #5a3f9e);
      }
      .card {
        width: 150px;
        text-align: center;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
      }
      .card .ring {
        width: 128px;
        height: 128px;
        margin: 0 auto 6px;
        border-radius: 50%;
        border: 4px solid var(--c);
        background: radial-gradient(circle at 50% 35%, #ffffff, var(--c));
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      }
      .card img {
        width: 100%;
        height: 100%;
        display: block;
      }
      #pv {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        height: 400px;
        border-radius: 22px;
        background: radial-gradient(circle at 50% 30%, #ffffff, #b69cff);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <script type="module">
      import * as THREE from 'three';
      import { SKINS, RARITY } from '../src/skins.js';
      import { RIVALS } from '../src/data.js';
      import { createPlayer, createRival, createVillager, portraitURL, Preview, resourceItemMesh } from '../src/3d/characters.js';

      const P = new URLSearchParams(location.search);
      const num = (k, d) => (P.has(k) && Number.isFinite(+P.get(k)) ? +P.get(k) : d);

      if (P.get('portraits')) portraits();
      else if (P.get('preview')) preview();
      else lineup();

      function portraits() {
        document.getElementById('c').remove();
        const grid = document.createElement('div');
        grid.id = 'grid';
        document.body.append(grid);
        const size = num('size', 128);
        const add = (label, url, color) => {
          const d = document.createElement('div');
          d.className = 'card';
          d.style.setProperty('--c', color);
          d.innerHTML = `<div class="ring"><img alt=""></div>${label}`;
          d.querySelector('img').src = url;
          grid.append(d);
        };
        const t0 = performance.now();
        for (const s of SKINS) add(s.name, portraitURL('player', s, size), RARITY[s.rarity].color);
        for (const r of RIVALS) add(r.name, portraitURL('rival', r, size), r.color);
        add('Villager', portraitURL('villager', null, size), '#ff8c42');
        console.log(`portraits: ${Math.round(performance.now() - t0)} ms`);
        requestAnimationFrame(() => requestAnimationFrame(() => (window.__ready = true)));
      }

      function preview() {
        document.getElementById('c').remove();
        const cv = document.createElement('canvas');
        cv.id = 'pv';
        document.body.append(cv);
        const pv = new Preview(cv);
        const ids = P.get('skin') ? [P.get('skin')] : SKINS.map((s) => s.id);
        let i = 0;
        let next = 0;
        let last = performance.now();
        let frames = 0;
        function loop(now) {
          const dt = (now - last) / 1000;
          last = now;
          next -= dt;
          if (next <= 0) {
            pv.show(createPlayer(ids[i++ % ids.length]));
            next = 2.5;
          }
          pv.update(dt);
          if (++frames === 4) window.__ready = true;
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        window.__pv = pv;
      }

      function lineup() {
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = P.get('tone') === 'none' ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog('#cdeaff', 45, 120);

        // Meadow Isle lighting (same values as THEMES[0])
        const hemi = new THREE.HemisphereLight('#ffffff', '#6b8f58', 1.1);
        const sun = new THREE.DirectionalLight('#fff1d0', 2.4);
        sun.position.set(0.55, 1, 0.35).multiplyScalar(20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
        sun.shadow.bias = -0.0005;
        sun.shadow.normalBias = 0.03;
        scene.add(hemi, sun, sun.target);

        const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#8fd672', roughness: 0.9 }));
        ground.receiveShadow = true;
        scene.add(ground);

        // who is in the lineup
        const entries = [];
        const set = P.get('set') || 'all';
        const addSkin = (s) => entries.push({ label: s.name, make: () => createPlayer(s) });
        const addRival = (r) => entries.push({ label: r.name, make: () => createRival(r) });
        const addVillager = () => entries.push({ label: 'Villager', make: createVillager });
        if (set === 'all' || set === 'skins') SKINS.forEach(addSkin);
        if (set === 'all' || set === 'rivals') {
          RIVALS.forEach(addRival);
          addVillager();
        }
        if (!['all', 'skins', 'rivals'].includes(set)) {
          for (const id of set.split(',')) {
            const s = SKINS.find((x) => x.id === id);
            const r = RIVALS.find((x) => x.id === id);
            if (s) addSkin(s);
            else if (r) addRival(r);
            else if (id === 'villager') addVillager();
          }
        }

        const cols = Math.max(1, Math.min(entries.length, num('cols', 7)));
        const rows = Math.ceil(entries.length / cols);
        const SP = 1.45;
        const ROW = 2.8;
        const yaw = (num('yaw', 0) * Math.PI) / 180;
        const chars = entries.map((e, i) => {
          const c = e.make();
          const r = Math.floor(i / cols);
          const inRow = Math.min(cols, entries.length - r * cols);
          const x = (i % cols - (inRow - 1) / 2) * SP + (r % 2 ? SP * 0.25 : 0);
          const z = -r * ROW;
          scene.add(c.group);
          const div = document.createElement('div');
          div.textContent = e.label;
          document.getElementById('labels').append(div);
          return { c, x, z, div };
        });

        const ANIM = {
          idle: {},
          walk: { state: 'walk', moving: 1 },
          jog: { state: 'walk', moving: 0.5 },
          gather: { state: 'gather', res: 'wood' },
          scoop: { state: 'gather', res: 'sand' },
          deposit: { state: 'deposit' },
          wait: { state: 'wait' },
          think: { state: 'think' },
          cheer: { emote: 'cheer' },
          sad: { emote: 'sad' },
          hop: { emote: 'hop' },
          wave: { emote: 'wave' },
        };
        const carry = P.get('carry') ? P.get('carry').split(',') : [];
        const list = P.get('anim') === 'mix' ? Object.keys(ANIM) : (P.get('anim') || 'idle').split(',');
        const mixed = list.length > 1;
        chars.forEach((k, i) => {
          const name = ANIM[list[i % list.length]] ? list[i % list.length] : 'idle';
          const a = ANIM[name];
          k.params = { x: k.x, z: k.z, heading: yaw, moving: a.moving || 0, state: a.state || 'idle', emote: a.emote || null, res: a.res, carry };
          if (mixed) k.div.textContent += ' · ' + name;
        });

        // camera: fit the lineup
        const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
        const centerZ = -((rows - 1) * ROW) / 2;
        function fit() {
          const w = innerWidth;
          const h = innerHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          const vf = (camera.fov * Math.PI) / 180;
          const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
          const width = (Math.min(cols, entries.length) - 1) * SP + 2.2;
          const height = rows * 1.5 + 1.4;
          const dist = Math.max(width / 2 / Math.tan(hf / 2), height / 2 / Math.tan(vf / 2)) * num('zoom', 1) + 1.5;
          const lookY = num('lookY', 0.95);
          camera.position.set(num('camX', 0), lookY + dist * num('pitch', rows > 1 ? 0.5 : 0.3), centerZ + dist);
          camera.lookAt(num('camX', 0), lookY, centerZ);
          camera.updateProjectionMatrix();
        }
        fit();
        addEventListener('resize', fit);

        const v = new THREE.Vector3();
        function labels() {
          for (const k of chars) {
            v.set(k.x, -0.05, k.z + 0.5).project(camera);
            k.div.style.left = ((v.x + 1) / 2) * innerWidth + 'px';
            k.div.style.top = ((1 - v.y) / 2) * innerHeight + 'px';
          }
        }
        function step(dt) {
          for (const k of chars) k.c.update(dt, k.params);
        }

        if (P.get('items')) {
          // big resource items on a row in front, for checking their look
          ['wood', 'stone', 'ore', 'sand', 'fiber', 'crystal'].forEach((t, i) => {
            const m = resourceItemMesh(t);
            m.scale.setScalar(3);
            m.position.set((i - 2.5) * 1.1, 0, 1.6);
            scene.add(m);
          });
        }

        const freeze = P.has('t') ? num('t', 0) : null;
        if (freeze !== null) {
          for (let t = 0; t < freeze; t += 1 / 60) step(1 / 60);
          step(0);
          renderer.render(scene, camera);
          labels();
          requestAnimationFrame(() => {
            renderer.render(scene, camera);
            window.__ready = true;
          });
          window.__chars = chars;
          return;
        }
        let last = performance.now();
        let frames = 0;
        function loop(now) {
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          step(dt);
          renderer.render(scene, camera);
          labels();
          if (++frames === 3) window.__ready = true;
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        window.__chars = chars;
        window.__info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, progs: renderer.info.programs.length });
      }
    </script>
  </body>
</html>
