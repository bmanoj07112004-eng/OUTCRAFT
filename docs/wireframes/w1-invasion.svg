<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 930" width="760" height="930" role="img" aria-labelledby="w1-title w1-desc">
  <title id="w1-title">ECHOES wireframe 1: invasion telegraph and Echo duel HUD</title>
  <desc id="w1-desc">Portrait phone wireframe of the Echo duel at 06:55 of a 15-minute open stage. A duel bar under the top HUD shows a 60 second ring timer at 0:41, the Echo's HP at 55%, a TOUGH label and two tell chips (orbits clockwise, keeps its distance). On the playfield the Echo glows as it commits to a dive toward the host, its clockwise orbit is drawn as a dashed arc, and a 0.6 second Chain Lightning mark rings the host. Inset A shows the paused telegraph card with the tell, the three skills the Echo fights with, the three-card prize and a READY button. Inset C shows the off-screen edge arrow. Numbered callouts are explained in the legend on the right.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .b { font-weight: 700; }
      .sb { font-weight: 600; }
      .co circle { fill: #111114; stroke: #ffffff; stroke-width: 2; }
      .co text { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .lg { font-size: 11.5px; fill: #2a2a2e; }
      .ln circle { fill: #111114; }
      .ln text { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .ic { fill: #d5d5da; }
      .lv { font-size: 11px; font-weight: 700; fill: #3a3a40; text-anchor: end; }
      .kl { font-size: 9.5px; font-weight: 700; fill: #8a8a93; letter-spacing: 0.6px; }
      .pz { font-size: 11px; fill: #ffffff; }
      .pl { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: end; }
    </style>
    <clipPath id="w1-screen"><rect x="0" y="0" width="390" height="844" rx="42"/></clipPath>
    <pattern id="w1-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#dcdce1" stroke-width="1"/>
    </pattern>
    <g id="mob">
      <circle cx="0" cy="-5" r="4"/>
      <path d="M-6 7C-6 1-3.5-2 0-2S6 1 6 7Z"/>
    </g>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="930" fill="#f3f3f5"/>

  <!-- device frame -->
  <rect x="6" y="170" width="4" height="56" rx="2" fill="#2a2a2d"/>
  <rect x="6" y="240" width="4" height="56" rx="2" fill="#2a2a2d"/>
  <rect x="428" y="210" width="4" height="84" rx="2" fill="#2a2a2d"/>
  <rect x="10" y="14" width="418" height="872" rx="56" fill="#1d1d1f"/>
  <rect x="13" y="17" width="412" height="866" rx="53" fill="none" stroke="#3a3a3e" stroke-width="1.5"/>

