      <rect x="16" y="72" width="52" height="24" rx="12" fill="#2b2b30"/>
      <text x="42" y="88" font-size="12" class="b" fill="#ffffff" text-anchor="middle">Lv 14</text>
      <rect x="74" y="74" width="40" height="20" rx="10" fill="#ffffff" stroke="#8a8a93" stroke-dasharray="3 2"/>
      <text x="94" y="88" font-size="11" class="b" fill="#55555c" text-anchor="middle">+1</text>
      <text x="195" y="94" font-size="26" class="b" fill="#1a1a1a" text-anchor="middle">06:55</text>
      <text x="334" y="89" font-size="12" fill="#55555c" text-anchor="end">1,284 kills</text>
      <rect x="344" y="71" width="30" height="28" rx="8" fill="#efeff2" stroke="#cfcfd5"/>
      <rect x="354" y="78" width="3.5" height="14" rx="1" fill="#55555c"/>
      <rect x="360.5" y="78" width="3.5" height="14" rx="1" fill="#55555c"/>
      <!-- stage track: 15 min over 330 px (22 px per minute) -->
      <rect x="30" y="108" width="330" height="6" rx="3" fill="#d9d9de"/>
      <rect x="30" y="108" width="152.2" height="6" rx="3" fill="#8a8a93"/>
      <rect x="173" y="108" width="44" height="6" fill="#ff4d6d" fill-opacity="0.75"/>
      <path d="M140 105L145 111L140 117L135 111Z" fill="#2b2b30"/>
      <path d="M250 105L255 111L250 117L245 111Z" fill="#2b2b30"/>
      <path d="M358 105L363 111L358 117L353 111Z" fill="#2b2b30"/>
      <text x="30" y="129" font-size="11" fill="#6b6b73">0:00</text>
      <text x="140" y="129" font-size="11" fill="#3a3a40" text-anchor="middle">5:00</text>
      <text x="195" y="129" font-size="11" class="b" fill="#3a3a40" text-anchor="middle">W1 6:30–8:30</text>
      <text x="250" y="129" font-size="11" fill="#3a3a40" text-anchor="middle">10:00</text>
      <text x="362" y="129" font-size="11" fill="#3a3a40" text-anchor="end">15:00</text>

      <!-- duel bar, anchored under the top HUD -->
      <rect x="12" y="144" width="366" height="68" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#d4d4d8"/>
      <circle cx="46" cy="178" r="22" fill="#ffffff" stroke="#d0d0d6" stroke-width="5"/>
      <path d="M46 156A22 22 0 1 1 25.9 186.9" fill="none" stroke="#2b2b30" stroke-width="5" stroke-linecap="round"/>
      <text x="46" y="182" font-size="11" class="b" fill="#111114" text-anchor="middle">0:41</text>
      <text x="80" y="166" font-size="12" class="b" fill="#1a1a1a">RAVI_07's Echo <tspan class="sb" fill="#8a8a93" font-size="11">· AI</tspan></text>
      <rect x="316" y="153" width="50" height="18" rx="9" fill="#ff4d6d"/>
      <text x="341" y="166" font-size="10.5" class="b" fill="#1f1f23" text-anchor="middle">TOUGH</text>
      <rect x="80" y="174" width="286" height="8" rx="4" fill="#f6c3cd"/>
      <rect x="80" y="174" width="157" height="8" rx="4" fill="#ff4d6d"/>
      <rect x="80" y="188" width="112" height="18" rx="9" fill="#f1f1f3" stroke="#c4c4cb"/>
      <text x="136" y="201" font-size="10.5" fill="#3a3a40" text-anchor="middle">↻ Orbits clockwise</text>
      <rect x="198" y="188" width="118" height="18" rx="9" fill="#f1f1f3" stroke="#c4c4cb"/>
      <text x="257" y="201" font-size="10.5" fill="#3a3a40" text-anchor="middle">Keeps its distance</text>

      <!-- host build bar -->
      <rect x="12" y="716" width="366" height="86" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#d4d4d8"/>
      <text x="24" y="740" font-size="11" class="sb" fill="#3a3a40">Active</text>
      <text x="24" y="754" font-size="11" fill="#77777f">5/6</text>
      <text x="24" y="778" font-size="11" class="sb" fill="#3a3a40">Passive</text>
      <text x="24" y="792" font-size="11" fill="#77777f">6/6</text>
