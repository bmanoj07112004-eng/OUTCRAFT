      <rect x="0" y="0" width="390" height="844" fill="url(#w1-grid)"/>

      <!-- horde thinned to 50% -->
      <g fill="#a7a7ae">
        <use xlink:href="#mob" x="40" y="250"/><use xlink:href="#mob" x="120" y="236"/><use xlink:href="#mob" x="336" y="250"/>
        <use xlink:href="#mob" x="60" y="300"/><use xlink:href="#mob" x="152" y="300"/><use xlink:href="#mob" x="248" y="262"/>
        <use xlink:href="#mob" x="30" y="420"/><use xlink:href="#mob" x="70" y="470"/><use xlink:href="#mob" x="360" y="520"/>
        <use xlink:href="#mob" x="340" y="580"/><use xlink:href="#mob" x="40" y="600"/><use xlink:href="#mob" x="96" y="648"/>
