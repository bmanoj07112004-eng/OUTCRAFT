      <rect x="308" y="22" width="3" height="6" rx="1" fill="#1a1a1a"/>
      <rect x="313" y="19" width="3" height="9" rx="1" fill="#1a1a1a"/>
      <rect x="318" y="16" width="3" height="12" rx="1" fill="#1a1a1a"/>
