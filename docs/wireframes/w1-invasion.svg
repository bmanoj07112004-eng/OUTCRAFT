        <rect class="ic" x="86" y="726" width="40" height="30" rx="7"/><text class="lv" x="121" y="751">4</text>
        <rect class="ic" x="134" y="726" width="40" height="30" rx="7"/><text class="lv" x="169" y="751">5</text>
        <rect class="ic" x="182" y="726" width="40" height="30" rx="7"/><text class="lv" x="217" y="751">3</text>
        <rect class="ic" x="230" y="726" width="40" height="30" rx="7"/><text class="lv" x="265" y="751">2</text>
        <rect class="ic" x="278" y="726" width="40" height="30" rx="7"/><text class="lv" x="313" y="751">2</text>
        <rect x="326" y="726" width="40" height="30" rx="7" fill="none" stroke="#b0b0b8" stroke-dasharray="3 3"/>
        <rect class="ic" x="86" y="764" width="40" height="30" rx="7"/><text class="lv" x="121" y="789">3</text>
        <rect class="ic" x="134" y="764" width="40" height="30" rx="7"/><text class="lv" x="169" y="789">2</text>
        <rect class="ic" x="182" y="764" width="40" height="30" rx="7"/><text class="lv" x="217" y="789">4</text>
        <rect class="ic" x="230" y="764" width="40" height="30" rx="7"/><text class="lv" x="265" y="789">2</text>
        <rect class="ic" x="278" y="764" width="40" height="30" rx="7"/><text class="lv" x="313" y="789">1</text>
        <rect class="ic" x="326" y="764" width="40" height="30" rx="7"/><text class="lv" x="361" y="789">3</text>
      </g>

      <!-- home indicator -->
      <rect x="128" y="824" width="134" height="5" rx="2.5" fill="#1d1d1f"/>
    </g>
  </g>

  <!-- callouts on the phone (global coordinates) -->
  <g class="co"><circle cx="274" cy="110" r="10"/><text x="274" y="114">1</text></g>
  <g class="co"><circle cx="38" cy="206" r="10"/><text x="38" y="210">2</text></g>
  <g class="co"><circle cx="400" cy="206" r="10"/><text x="400" y="210">3</text></g>
  <g class="co"><circle cx="352" cy="226" r="10"/><text x="352" y="230">4</text></g>
  <g class="co"><circle cx="366" cy="380" r="10"/><text x="366" y="384">5</text></g>
  <g class="co"><circle cx="174" cy="558" r="10"/><text x="174" y="562">6</text></g>
  <g class="co"><circle cx="296" cy="556" r="10"/><text x="296" y="560">7</text></g>
  <g class="co"><circle cx="86" cy="620" r="10"/><text x="86" y="624">8</text></g>
  <g class="co"><circle cx="38" cy="746" r="10"/><text x="38" y="750">9</text></g>
  <g class="co"><circle cx="124" cy="384" r="10"/><text x="124" y="388">10</text></g>

  <!-- ============ LEGEND PANEL ============ -->
  <rect x="446" y="28" width="300" height="890" rx="14" fill="#ffffff" stroke="#dcdce0"/>
  <text x="464" y="58" font-size="16" class="b" fill="#111114">W1 · Invasion</text>
  <text x="464" y="77" font-size="11" fill="#6b6b73">Phone = B, the duel · A = telegraph · spec §4</text>

  <!-- inset A: the paused telegraph card -->
  <text x="464" y="98" font-size="11" class="b" fill="#3a3a40">A · TELEGRAPH: GAME PAUSED UNTIL READY</text>
  <rect x="464" y="106" width="266" height="244" rx="12" fill="#1f1f23" stroke="#ff4d6d" stroke-width="2"/>
  <text x="476" y="128" font-size="14" class="b" fill="#ff4d6d">ECHO OF RAVI_07 INVADES</text>
  <text x="476" y="146" font-size="10.5" fill="#c9c9cf">AI trained on RAVI_07's movement</text>
  <rect x="674" y="135" width="46" height="16" rx="8" fill="#ff4d6d"/>
  <text x="697" y="147" font-size="9.5" class="b" fill="#1f1f23" text-anchor="middle">TOUGH</text>
  <text class="kl" x="476" y="170">TELL</text>
  <text x="476" y="185" font-size="10.5" fill="#ffffff">↻ Orbits clockwise · keeps its distance</text>
  <text class="kl" x="476" y="207">FIGHTS WITH</text>
  <text x="476" y="222" font-size="10.5" fill="#ffffff">Chain Lightning · Orbit Saw · Blade Fan</text>
  <text class="kl" x="476" y="244">PRIZE IF YOU WIN (FIXED NOW)</text>
  <rect x="476" y="251" width="10" height="10" rx="2" fill="#6b6b74"/>
  <text class="pz" x="492" y="260">★ Chain Lightning</text><text class="pl" x="718" y="260">Lv 3 · new</text>
  <rect x="476" y="268" width="10" height="10" rx="2" fill="#6b6b74"/>
  <text class="pz" x="492" y="277">Cold Core</text><text class="pl" x="718" y="277">Lv 2 · new</text>
  <rect x="476" y="285" width="10" height="10" rx="2" fill="#6b6b74"/>
  <text class="pz" x="492" y="294">Blade Fan</text><text class="pl" x="718" y="294">Lv 2 → 3</text>
  <text x="476" y="314" font-size="10.5" fill="#c9c9cf">Fight for it, or run out the 60 s clock.</text>
  <rect x="476" y="321" width="242" height="22" rx="8" fill="#ff4d6d"/>
  <text x="597" y="336" font-size="11.5" class="b" fill="#1f1f23" text-anchor="middle" letter-spacing="1">READY</text>

  <!-- inset C: off-screen Echo -->
  <rect x="464" y="358" width="266" height="40" rx="10" fill="#e9e9ec" stroke="#bdbdc4" stroke-dasharray="5 4"/>
  <text x="476" y="374" font-size="11" class="b" fill="#3a3a40">C · Echo off-screen</text>
  <text x="476" y="389" font-size="11" fill="#55555c">Edge arrow + distance; haptic tick</text>
  <text x="704" y="382" font-size="10" class="b" fill="#ff4d6d" text-anchor="end">11 m</text>
  <path d="M710 368L726 378L710 388Z" fill="#ff4d6d"/>

  <!-- numbered legend -->
  <g class="ln"><circle cx="474" cy="416" r="8.5"/><text x="474" y="420">1</text></g>
  <text class="lg"><tspan x="490" y="420">Run HUD at 06:55. +1 = a level-up that</tspan><tspan x="490" y="434.5">waits until the duel ends. Track: W1</tspan><tspan x="490" y="449">6:30–8:30 bounds the Echo's arrival.</tspan></text>
  <g class="ln"><circle cx="474" cy="466" r="8.5"/><text x="474" y="470">2</text></g>
  <text class="lg"><tspan x="490" y="470">Duel bar under the top HUD: 60 s ring</tspan><tspan x="490" y="484.5">timer on in-game time.</tspan></text>
  <g class="ln"><circle cx="474" cy="500" r="8.5"/><text x="474" y="504">3</text></g>
  <text class="lg"><tspan x="490" y="504">Echo HP, sized to die in ~25 s if your</tspan><tspan x="490" y="518.5">weapons stay on it (§7). Label: d × r.</tspan></text>
  <g class="ln"><circle cx="474" cy="534" r="8.5"/><text x="474" y="538">4</text></g>
  <text class="lg"><tspan x="490" y="538">Tell chips from the owner's movement:</tspan><tspan x="490" y="552.5">the read you play against.</tspan></text>
  <g class="ln"><circle cx="474" cy="568" r="8.5"/><text x="474" y="572">5</text></g>
  <text class="lg"><tspan x="490" y="572">Commit: glows 0.5 s, then dives inside</tspan><tspan x="490" y="586.5">your shortest range for ~2 s.</tspan></text>
  <g class="ln"><circle cx="474" cy="602" r="8.5"/><text x="474" y="606">6</text></g>
  <text class="lg"><tspan x="490" y="606">Chain Lightning's tell: a 0.6 s mark.</tspan><tspan x="490" y="620.5">Step out of the ring before it arcs.</tspan></text>
  <g class="ln"><circle cx="474" cy="636" r="8.5"/><text x="474" y="640">7</text></g>
  <text class="lg"><tspan x="490" y="640">Your weapons prefer the Echo whenever</tspan><tspan x="490" y="654.5">it is in their range.</tspan></text>
  <g class="ln"><circle cx="474" cy="670" r="8.5"/><text x="474" y="674">8</text></g>
  <text class="lg"><tspan x="490" y="674">Spawns thin to 50%. Mobs ignore the</tspan><tspan x="490" y="688.5">Echo; its shots pass through them.</tspan></text>
  <g class="ln"><circle cx="474" cy="704" r="8.5"/><text x="474" y="708">9</text></g>
  <text class="lg"><tspan x="490" y="708">No level-ups mid-duel, so the prize on</tspan><tspan x="490" y="722.5">the telegraph stays valid.</tspan></text>
  <g class="ln"><circle cx="474" cy="738" r="8.5"/><text x="474" y="742">10</text></g>
  <text class="lg"><tspan x="490" y="742">Its clockwise orbit. Move against it to</tspan><tspan x="490" y="756.5">meet the dive with your saws.</tspan></text>

  <!-- outcomes -->
  <line x1="464" y1="772" x2="728" y2="772" stroke="#e4e4e8"/>
  <text x="464" y="792" font-size="11" class="b" fill="#3a3a40" letter-spacing="0.6">OUTCOMES · §4.1 TARGETS</text>
  <text class="lg"><tspan x="468" y="811">•</tspan><tspan x="480" y="811">Win, ~75%: THE STEAL (W2), +10 Tribute.</tspan></text>
  <text class="lg"><tspan x="468" y="829">•</tspan><tspan x="480" y="829">Clock runs out, ≤ 15%: the Echo fades.</tspan></text>
  <text class="lg"><tspan x="468" y="847">•</tspan><tspan x="480" y="847">Echo breaks you, 10–15%: HP set to 10%,</tspan><tspan x="480" y="861.5">2 s invulnerable, it leaves. Not lethal.</tspan></text>
  <text class="lg"><tspan x="468" y="880">•</tspan><tspan x="480" y="880">No paid pop-ups for 60 s afterwards.</tspan></text>
  <text x="464" y="906" font-size="11" fill="#8a8a93">Skill names are hypothetical. Opt-out: Echo Beacon.</text>
</svg>
