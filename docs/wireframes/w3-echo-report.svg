<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="w3-title w3-desc">
  <title id="w3-title">ECHOES wireframe 3: Echo Report on return</title>
  <desc id="w3-desc">Portrait phone wireframe of the Echo Report shown to RAVI_07 after a three-day absence. Above the fold: the Echo portrait with its cosmetic aura, a one-line story (ANANYA stole your Chain Lightning and cleared Chapter 8 with it), a summary (7 runs invaded, 1 player beaten), +80 Tribute with a single CLAIM and PLAY button, and one rewarded-ad link. Below the fold: four stats (7 invasions, 5 defeated, 1 Echo win, 1 timed out), the most coveted card, the Echo's movement tell, and recent encounters including a friend with a Summon Echo button. Numbered callouts are explained in the legend on the right.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .b { font-weight: 700; }
      .sb { font-weight: 600; }
      .co circle { fill: #111114; stroke: #ffffff; stroke-width: 2; }
      .co text { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .lg { font-size: 11.5px; fill: #2a2a2e; }
      .ln circle { fill: #111114; }
      .ln text { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #dcdce0; }
      .num { font-size: 20px; font-weight: 700; fill: #111114; text-anchor: middle; }
      .cap { font-size: 11px; fill: #6b6b73; text-anchor: middle; }
      .nm { font-size: 13px; font-weight: 700; fill: #111114; }
      .ds { font-size: 11.5px; fill: #55555c; }
      .tr { font-size: 12px; font-weight: 700; fill: #3a3a40; text-anchor: end; }
      .av { fill: #d5d5da; }
    </style>
    <clipPath id="w3-screen"><rect x="0" y="0" width="390" height="844" rx="42"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="760" height="900" fill="#f3f3f5"/>

  <!-- device frame -->
  <rect x="6" y="170" width="4" height="56" rx="2" fill="#2a2a2d"/>
  <rect x="6" y="240" width="4" height="56" rx="2" fill="#2a2a2d"/>
  <rect x="428" y="210" width="4" height="84" rx="2" fill="#2a2a2d"/>
  <rect x="10" y="14" width="418" height="872" rx="56" fill="#1d1d1f"/>
  <rect x="13" y="17" width="412" height="866" rx="53" fill="none" stroke="#3a3a3e" stroke-width="1.5"/>

  <!-- ============ PHONE SCREEN ============ -->
  <g transform="translate(24 28)">
    <g clip-path="url(#w3-screen)">
      <rect x="0" y="0" width="390" height="844" fill="#f6f6f8"/>

      <!-- status bar -->
      <text x="36" y="30" font-size="14" class="sb" fill="#1a1a1a">9:41</text>
      <rect x="128" y="10" width="134" height="28" rx="14" fill="#1d1d1f"/>
      <rect x="308" y="22" width="3" height="6" rx="1" fill="#1a1a1a"/>
      <rect x="313" y="19" width="3" height="9" rx="1" fill="#1a1a1a"/>
      <rect x="318" y="16" width="3" height="12" rx="1" fill="#1a1a1a"/>
      <rect x="330" y="16" width="24" height="12" rx="3" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
      <rect x="332" y="18" width="16" height="8" rx="1.5" fill="#1a1a1a"/>

      <!-- header -->
      <text x="24" y="66" font-size="11" class="b" fill="#6b6b73" letter-spacing="0.6">WHILE YOU WERE AWAY · 3 DAYS</text>
      <text x="24" y="92" font-size="22" class="b" fill="#111114">Echo Report</text>
      <circle cx="360" cy="72" r="14" fill="#ececef"/>
      <path d="M354 66L366 78M366 66L354 78" stroke="#55555c" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== BEAT 1: the story ===== -->
      <rect class="card" x="16" y="108" width="358" height="266" rx="16"/>
      <!-- Echo portrait with cosmetic aura -->
      <circle cx="195" cy="160" r="38" fill="#ececef" stroke="#9b9ba3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="195" cy="160" r="28" fill="none" stroke="#c4c4cb" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="195" cy="150" r="9" fill="#6b6b73"/>
      <path d="M179 180C180 168 186 163 195 163S210 168 211 180Z" fill="#6b6b73"/>
      <rect x="147" y="204" width="96" height="18" rx="9" fill="#ffffff" stroke="#b9b9c1"/>
      <text x="195" y="217" font-size="11" fill="#3a3a40" text-anchor="middle">Ember Wisp aura</text>
      <text x="195" y="240" font-size="11" fill="#6b6b73" text-anchor="middle">RAVI_07's Echo · Chapter 8 · expires in 4 days</text>
      <!-- story headline -->
      <text font-size="20" class="b" fill="#111114">
        <tspan x="32" y="274">ANANYA stole your</tspan>
        <tspan x="32" y="299">Chain Lightning and cleared</tspan>
        <tspan x="32" y="324">Chapter 8 with it.</tspan>
      </text>
      <text x="32" y="354" font-size="13" fill="#3a3a40">Your Echo invaded <tspan class="b">7 runs</tspan> and beat <tspan class="b">1 player</tspan>.</text>

      <!-- claim: the one primary button -->
      <rect class="card" x="16" y="386" width="358" height="64" rx="12"/>
      <text x="30" y="414" font-size="18" class="b" fill="#111114">+80 TRIBUTE</text>
      <text x="30" y="434" font-size="11" fill="#6b6b73">7 × 10 + 1 × 10</text>
      <rect x="196" y="396" width="168" height="44" rx="10" fill="#7c5cff"/>
      <text x="280" y="423" font-size="14" class="b" fill="#ffffff" text-anchor="middle" letter-spacing="1">CLAIM &amp; PLAY</text>
      <text x="195" y="474" font-size="12" class="b" fill="#7c5cff" text-anchor="middle">▶ Watch an ad: +80 more Tribute</text>

      <!-- fold -->
      <line x1="24" y1="496" x2="130" y2="496" stroke="#c4c4cb"/>
      <line x1="260" y1="496" x2="366" y2="496" stroke="#c4c4cb"/>
      <text x="195" y="500" font-size="11" class="b" fill="#8a8a93" text-anchor="middle" letter-spacing="0.6">DETAILS ▾</text>

      <!-- ===== BEAT 2: details on scroll ===== -->
      <rect class="card" x="16" y="512" width="85" height="52" rx="12"/>
      <text class="num" x="58.5" y="537">7</text><text class="cap" x="58.5" y="554">Invasions</text>
      <rect class="card" x="107" y="512" width="85" height="52" rx="12"/>
      <text class="num" x="149.5" y="537">5</text><text class="cap" x="149.5" y="554">Defeated</text>
      <rect class="card" x="198" y="512" width="85" height="52" rx="12"/>
      <text class="num" x="240.5" y="537">1</text><text class="cap" x="240.5" y="554">Echo win</text>
      <rect class="card" x="289" y="512" width="85" height="52" rx="12"/>
      <text class="num" x="331.5" y="537">1</text><text class="cap" x="331.5" y="554">Timed out</text>

      <!-- most coveted + tell -->
      <rect class="card" x="16" y="574" width="358" height="72" rx="12"/>
      <rect x="28" y="582" width="36" height="36" rx="9" fill="#e4e4e8" stroke="#c4c4cb" stroke-width="1.2"/>
      <path d="M33 587L59 613M59 587L33 613" stroke="#c4c4cb" stroke-width="1.2"/>
      <text x="76" y="595" font-size="11" class="b" fill="#6b6b73" letter-spacing="0.5">MOST COVETED</text>
      <text x="76" y="614" font-size="14" class="b" fill="#111114">Chain Lightning, stolen 3×</text>
      <circle cx="36" cy="632" r="6" fill="none" stroke="#55555c" stroke-width="1.5"/>
      <path d="M40.5 628L43 625.5M40.5 628L43 630.5" stroke="#55555c" stroke-width="1.5" stroke-linecap="round"/>
      <text x="50" y="636" font-size="11.5" fill="#3a3a40">Your Echo's tell: orbits clockwise 78% of the time</text>

      <!-- recent encounters (list continues below the screen) -->
      <text x="24" y="670" font-size="11" class="b" fill="#6b6b73" letter-spacing="0.6">RECENT ENCOUNTERS</text>
      <text x="366" y="670" font-size="11" class="b" fill="#7c5cff" text-anchor="end">See all 7</text>
      <rect class="card" x="16" y="678" width="358" height="200" rx="12"/>
      <!-- row 1: friend -->
      <circle class="av" cx="40" cy="700" r="12"/>
      <text class="nm" x="60" y="697">ANANYA</text>
      <rect x="120" y="686" width="50" height="16" rx="8" fill="#ffffff" stroke="#2b2b30"/>
      <text x="145" y="698" font-size="11" class="b" fill="#2b2b30" text-anchor="middle">FRIEND</text>
      <text class="ds" x="60" y="714">stole your Chain Lightning</text>
      <rect x="262" y="688" width="72" height="26" rx="8" fill="#ffffff" stroke="#7c5cff" stroke-width="1.5"/>
      <text x="298" y="705" font-size="11" class="b" fill="#7c5cff" text-anchor="middle">SUMMON</text>
      <text class="tr" x="366" y="705">+10</text>
      <line x1="28" y1="724" x2="362" y2="724" stroke="#ececef"/>
      <!-- row 2 -->
      <circle class="av" cx="40" cy="742" r="11"/>
      <text class="nm" x="60" y="739">MEERA_22</text>
      <text class="ds" x="60" y="754">your Echo won</text>
      <text class="tr" x="366" y="746">+20</text>
      <line x1="28" y1="762" x2="362" y2="762" stroke="#ececef"/>
      <!-- row 3 -->
      <circle class="av" cx="40" cy="780" r="11"/>
      <text class="nm" x="60" y="777">K1TSUNE</text>
      <text class="ds" x="60" y="792">stole your Cold Core</text>
      <text class="tr" x="366" y="784">+10</text>
      <line x1="28" y1="800" x2="362" y2="800" stroke="#ececef"/>
      <!-- row 4, partly hidden: the list scrolls -->
      <circle class="av" cx="40" cy="818" r="11"/>
      <text class="nm" x="60" y="815">ZED_OP</text>
      <text class="ds" x="60" y="830">ran out the 60 s clock</text>
      <text class="tr" x="366" y="822">+10</text>
      <rect x="0" y="806" width="390" height="38" fill="#f6f6f8" fill-opacity="0.55"/>

      <!-- home indicator -->
      <rect x="128" y="824" width="134" height="5" rx="2.5" fill="#1d1d1f"/>
    </g>
  </g>

  <!-- callouts on the phone (global coordinates) -->
  <g class="co"><circle cx="398" cy="300" r="10"/><text x="398" y="304">1</text></g>
  <g class="co"><circle cx="160" cy="176" r="10"/><text x="160" y="180">2</text></g>
  <g class="co"><circle cx="398" cy="378" r="10"/><text x="398" y="382">3</text></g>
  <g class="co"><circle cx="40" cy="437" r="10"/><text x="40" y="441">4</text></g>
  <g class="co"><circle cx="398" cy="446" r="10"/><text x="398" y="450">5</text></g>
  <g class="co"><circle cx="106" cy="498" r="10"/><text x="106" y="502">6</text></g>
  <g class="co"><circle cx="398" cy="524" r="10"/><text x="398" y="528">7</text></g>
  <g class="co"><circle cx="40" cy="548" r="10"/><text x="40" y="552">8</text></g>
  <g class="co"><circle cx="398" cy="622" r="10"/><text x="398" y="626">9</text></g>
  <g class="co"><circle cx="276" cy="740" r="10"/><text x="276" y="744">10</text></g>

  <!-- ============ LEGEND PANEL ============ -->
  <rect x="446" y="28" width="300" height="844" rx="14" fill="#ffffff" stroke="#dcdce0"/>
  <text x="464" y="58" font-size="16" class="b" fill="#111114">W3 · Echo Report</text>
  <text x="464" y="77" font-size="11" fill="#6b6b73">Spec §6 · shown after 18 h+ away · two beats</text>

  <g class="ln"><circle cx="474" cy="100" r="8.5"/><text x="474" y="104">1</text></g>
  <text class="lg"><tspan x="490" y="104">Story first, the best single event:</tspan><tspan x="490" y="118.5">friend's steal &gt; signature stolen &gt; win.</tspan></text>
  <g class="ln"><circle cx="474" cy="134" r="8.5"/><text x="474" y="138">2</text></g>
  <text class="lg"><tspan x="490" y="138">The aura hosts see on the telegraph,</tspan><tspan x="490" y="152.5">the Core drop and the Steal header.</tspan></text>
  <g class="ln"><circle cx="474" cy="168" r="8.5"/><text x="474" y="172">3</text></g>
  <text class="lg"><tspan x="490" y="172">7 invasions in a 72 h absence: the §6</tspan><tspan x="490" y="186.5">estimate (~7). Illustrative.</tspan></text>
  <g class="ln"><circle cx="474" cy="202" r="8.5"/><text x="474" y="206">4</text></g>
  <text class="lg"><tspan x="490" y="206">10 per invasion, +10 per Echo win.</tspan><tspan x="490" y="220.5">Owner cap 100 a day (anti-farm).</tspan></text>
  <g class="ln"><circle cx="474" cy="236" r="8.5"/><text x="474" y="240">5</text></g>
  <text class="lg"><tspan x="490" y="240">The only primary button: claim, then</tspan><tspan x="490" y="254.5">straight into the next run.</tspan></text>
  <g class="ln"><circle cx="474" cy="270" r="8.5"/><text x="474" y="274">6</text></g>
  <text class="lg"><tspan x="490" y="274">The one rewarded ad: doubles this report</tspan><tspan x="490" y="288.5">(+80), once a day. Never on the Steal.</tspan></text>
  <g class="ln"><circle cx="474" cy="304" r="8.5"/><text x="474" y="308">7</text></g>
  <text class="lg"><tspan x="490" y="308">Beat two: details sit below the fold.</tspan></text>
  <g class="ln"><circle cx="474" cy="323.5" r="8.5"/><text x="474" y="327.5">8</text></g>
  <text class="lg"><tspan x="490" y="327.5">5 / 1 / 1 of 7 ≈ 71% wins, 14% breaks,</tspan><tspan x="490" y="342">14% timeouts: inside the §4.1 targets.</tspan></text>
  <g class="ln"><circle cx="474" cy="357.5" r="8.5"/><text x="474" y="361.5">9</text></g>
  <text class="lg"><tspan x="490" y="361.5">Stolen from = fame. The tell line reads</tspan><tspan x="490" y="376">back the owner's movement (illustrative).</tspan></text>
  <g class="ln"><circle cx="474" cy="391.5" r="8.5"/><text x="474" y="395.5">10</text></g>
  <text class="lg"><tspan x="490" y="395.5">SUMMON: their Echo takes your next</tspan><tspan x="490" y="410">Beacon-on run; expires in 72 h. No</tspan><tspan x="490" y="424.5">summon of a summon.</tspan></text>

  <!-- when it shows -->
  <line x1="464" y1="442" x2="728" y2="442" stroke="#e4e4e8"/>
  <text x="464" y="462" font-size="11" class="b" fill="#3a3a40" letter-spacing="0.6">WHEN IT SHOWS (§6)</text>
  <text class="lg"><tspan x="468" y="482">•</tspan><tspan x="480" y="482">Full screen only after 18 h+ away and</tspan><tspan x="480" y="496.5">1+ event; otherwise a home-screen card.</tspan></text>
  <text class="lg"><tspan x="468" y="516">•</tspan><tspan x="480" y="516">Push: max 1 a day, at your usual play</tspan><tspan x="480" y="530.5">hour, only for a story event.</tspan></text>

  <!-- report size -->
  <line x1="464" y1="548" x2="728" y2="548" stroke="#e4e4e8"/>
  <text x="464" y="568" font-size="11" class="b" fill="#3a3a40" letter-spacing="0.6">REPORT SIZE (§6 ESTIMATES)</text>
  <text class="lg" x="468" y="588">New player, back on D1</text><text class="lg b" x="726" y="588" text-anchor="end">~5 invasions</text>
  <text class="lg" x="468" y="606">Lapser, back after 72 h</text><text class="lg b" x="726" y="606" text-anchor="end">~7</text>
  <text class="lg" x="468" y="624">Daily player, back after 24 h</text><text class="lg b" x="726" y="624" text-anchor="end">0–1 (card)</text>
  <text class="lg"><tspan x="468" y="646">~3 invasions per on-duty Echo per day:</tspan><tspan x="468" y="660.5">owners away 18–72 h or new in 72 h.</tspan></text>

  <!-- moved off this screen -->
  <line x1="464" y1="678" x2="728" y2="678" stroke="#e4e4e8"/>
  <text x="464" y="698" font-size="11" class="b" fill="#3a3a40" letter-spacing="0.6">MOVED TO ECHO SETTINGS</text>
  <text class="lg"><tspan x="468" y="718">•</tspan><tspan x="480" y="718">Pin (keep past the 7-day expiry)</tspan></text>
  <text class="lg"><tspan x="468" y="737.5">•</tspan><tspan x="480" y="737.5">Change look (Tribute cosmetics)</tspan></text>
  <text class="lg"><tspan x="468" y="757">•</tspan><tspan x="480" y="757">Anonymous Echo (on by default under 18)</tspan></text>
  <text class="lg"><tspan x="468" y="776.5">•</tspan><tspan x="480" y="776.5">Tribute is never sold for money (§9).</tspan></text>
  <text x="464" y="858" font-size="11" fill="#8a8a93">Player names, skills and cosmetics are hypothetical.</text>
</svg>
